<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DroneParsel · 3B Sunum (MapLibre)</title>
<link rel="stylesheet" href="dp-3d.css">
<style>body{margin:0;background:#0f1923;color:#fff;font:14px 'Inter',system-ui,sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center}
.c{max-width:420px;padding:24px;text-align:center}.c h1{font-size:20px}.c label{display:inline-block;margin-top:14px;padding:12px 20px;background:#065F46;border-radius:14px;font-weight:700}
.c input{display:none}.c p{color:#94A3B8;font-size:12px}#err{color:#FBBF24}</style></head>
<body><div class="c"><h1>🏔 3B Sunum</h1><p>Bu sayfa ana uygulamadan bağımsızdır. GeoJSON veya KML parsel dosyanızı seçin.</p>
<label>Dosya seç<input id="f" type="file" accept=".geojson,.json,.kml"></label><p id="err"></p></div>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@6.5.0/turf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tmcw/togeojson@5.8.1/dist/togeojson.umd.js"></script>
<script>
/* dp-3d.js'in beklediği minimal yüzey: parcels, selId, DP.cur, ntf */
window.parcels=[];window.selId=null;window.DP={cur:function(){return parcels.find(function(p){return p.id===selId;})||parcels[0]||null;}};
window.ntf=function(m){document.getElementById('err').textContent=m;};
document.getElementById('f').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;
  f.text().then(function(t){
    var gj=/\.kml$/i.test(f.name)?toGeoJSON.kml(new DOMParser().parseFromString(t,'text/xml')):JSON.parse(t);
    var fs=gj.type==='FeatureCollection'?gj.features:gj.type==='Feature'?[gj]:[];
    parcels=fs.filter(function(x){return x.geometry&&/Polygon/.test(x.geometry.type);}).map(function(x,i){return {id:'p'+i,feature:x,fname:f.name};});
    if(!parcels.length)throw new Error('Dosyada çokgen (Polygon) parsel bulunamadı');
    selId=parcels[0].id;document.getElementById('err').textContent='';DP3D.open();
  }).catch(function(x){document.getElementById('err').textContent='⚠ '+x.message;});
  e.target.value='';});
</script>
<script src="dp-3d.js"></script>
<script>
/* Ana uygulamadan aktarılan parseller (10 dk içinde) varsa dosya seçmeden doğrudan aç */
window.addEventListener('load',function(){try{
  var h=JSON.parse(localStorage.getItem('dp3d.handoff')||'null');localStorage.removeItem('dp3d.handoff');
  if(h&&h.parcels&&h.parcels.length&&Date.now()-h.t<6e5){parcels=h.parcels;selId=h.selId||parcels[0].id;DP3D.open();}
}catch(e){document.getElementById('err').textContent='⚠ Aktarım okunamadı: '+e.message;}});
</script>
</body></html>
